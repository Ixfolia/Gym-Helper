# One-time job: copy the app's artwork from the old Base44 image CDN into
# public/art/ and commit it, so the app no longer depends on Base44.
# Delete this workflow once public/art/ is populated.
name: Bundle artwork

on:
  push:
    paths: [.github/workflows/bundle-artwork.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artwork
        run: |
          set -euo pipefail
          mkdir -p public/art
          base=https://media.base44.com/images/public/6a6b54647f3ea8aab4cd0d06
          while read -r src dest; do
            curl -fsSL --retry 4 -o "public/art/$dest" "$base/$src"
            file "public/art/$dest" | grep -q "PNG image" || { echo "$dest is not a PNG"; exit 1; }
          done <<'LIST'
          83b699302_001B-ascent-mountain-range.png 001B-ascent-mountain-range.png
          2c5430388_003-phase1-foundation-banner.png 003-phase1-foundation-banner.png
          e1cb53396_006A-phase2-walls-banner.png 006A-phase2-walls-banner.png
          61116920d_006B-phase3-city-banner.png 006B-phase3-city-banner.png
          b53849dbf_006C-phase4-zenith-banner.png 006C-phase4-zenith-banner.png
          a795e61f8_012A-badge-fire.png 012A-badge-fire.png
          c210a3b82_012B-badge-flex.png 012B-badge-flex.png
          d7c261b6b_012C-badge-diamond.png 012C-badge-diamond.png
          97ec24677_012D-badge-trophy.png 012D-badge-trophy.png
          63a9b84a1_012E-badge-crown.png 012E-badge-crown.png
          d07775ec2_016A-habit-slot1-crown-blue.png 016A-habit-slot1-crown-blue.png
          bbaa25ceb_016B-habit-slot2-sunrise-flex.png 016B-habit-slot2-sunrise-flex.png
          2240c3178_016C-habit-slot3-book.png 016C-habit-slot3-book.png
          e018e2128_016D-habit-slot4-bolt.png 016D-habit-slot4-bolt.png
          a153a23d2_017-icon-camera.png 017-icon-camera.png
          f44094241_020-icon-airplane.png 020-icon-airplane.png
          23ac7191c_020-icon-stopwatch.png 020-icon-stopwatch.png
          LIST
          ls -la public/art
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add public/art
          git diff --cached --quiet && exit 0
          git commit -m "Bundle artwork into public/art"
          git push
